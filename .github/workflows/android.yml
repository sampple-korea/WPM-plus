name: Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WPM_PLUS_DEBUG_KEY_ALIAS: wpm-plus-ci-debug
      WPM_PLUS_DEBUG_KEY_PASSWORD: ${{ secrets.WPM_PLUS_DEBUG_KEY_PASSWORD }}
      WPM_PLUS_DEBUG_KEYSTORE_BASE64: ${{ secrets.WPM_PLUS_DEBUG_KEYSTORE_BASE64 }}
      WPM_PLUS_DEBUG_STORE_PASSWORD: ${{ secrets.WPM_PLUS_DEBUG_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Require stable debug signing on main builds
        if: github.event_name == 'push' && env.WPM_PLUS_DEBUG_KEYSTORE_BASE64 == ''
        run: |
          echo "WPM_PLUS_DEBUG_KEYSTORE_BASE64 is required so debug APK signatures stay stable." >&2
          exit 1

      - name: Restore stable debug signing key
        if: env.WPM_PLUS_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          WPM_PLUS_DEBUG_STORE_FILE="$GITHUB_WORKSPACE/.ci-signing/wpm-plus-ci-debug.jks"
          mkdir -p "$(dirname "$WPM_PLUS_DEBUG_STORE_FILE")"
          printf '%s' "$WPM_PLUS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$WPM_PLUS_DEBUG_STORE_FILE"
          chmod 600 "$WPM_PLUS_DEBUG_STORE_FILE"
          echo "WPM_PLUS_DEBUG_STORE_FILE=$WPM_PLUS_DEBUG_STORE_FILE" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Verify debug APK signer
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: wpm-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
